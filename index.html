const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SV={'Cyber Services':['cy','Cyber'],'Cloud & Modern Infrastructure':['cl','Cloud & Infra'],'Smart Platforms':['sp','Smart Platforms'],'Digital Applications':['da','Applications'],'Digital Workplace':['dw','Poste de travail'],'Data & AI':['ai','Data & IA']};
const tier=q=>q>=85?['a','Prioritaire']:q>=65?['b','Fort']:q>=50?['c','Moyen']:['d','À surveiller'];
const lvl=v=>v>=80?'hi':v>=50?'mi':'lo';
const COLS=[['r','Rang'],['n','Entreprise'],['q','Qualification'],[null,'Services Atos'],['e','Adéquation services','Adéquation services (/100)'],['f','Taille & achat','Taille & capacité d’achat (/100)'],['g','Secteur & réf.','Alignement secteur & références (/100)'],['d','Prochaine relance'],[null,'']];
const st={q:'',svc:'',tier:'',key:'q',dir:-1,page:1,per:10,sel:null};
let last=null;
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function ini(n){const w=n.replace(/\(.*?\)/g,'').trim().split(/[\s-]+/).filter(Boolean);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()}
function view(){
  const q=st.q.trim().toLowerCase();
  const a=D.filter(x=>(!q||x.n.toLowerCase().includes(q))&&(!st.svc||x.s.includes(st.svc))&&(!st.tier||tier(x.q)[0]===st.tier));
  const k=st.key,d=st.dir;
  return a.sort((x,y)=>{let u=x[k],v=y[k];if(typeof u==='string'){return d*u.localeCompare(v,'fr')||x.i-y.i}return d*((u||0)-(v||0))||x.i-y.i});
}
function head(){
  $('#thr').innerHTML=COLS.map(([k,l,t])=>{
    if(!k)return `<th>${l}</th>`;
    const on=st.key===k;
    return `<th aria-sort="${on?(st.dir>0?'ascending':'descending'):'none'}"><button class="sortb" data-k="${k}" title="${esc(t||l)}">${l}</button></th>`}).join('');
}
function render(){
  const v=view(),per=st.per,pages=Math.max(1,Math.ceil(v.length/per));
  if(st.page>pages)st.page=pages;
  const rows=v.slice((st.page-1)*per,st.page*per);
  $('#tb').innerHTML=rows.map(x=>{
    const t=tier(x.q);
    const sc=k=>`<td><span class="sc">${x[k]}</span><span class="bar ${lvl(x[k])}"><i style="width:${x[k]}%"></i></span></td>`;
    return `<tr tabindex="0" data-r="${x.r}" class="${st.sel===x.r?'on':''}">
<td>${x.r}</td>
<td><div class="co"><span class="av" style="--h:${hue(x.n)}">${esc(ini(x.n))}</span><span title="${esc(x.n)}">${esc(x.n)}</span></div></td>
<td><span class="pill t-${t[0]}" title="${t[1]}">${x.q} %</span></td>
<td>${x.s.map(s=>`<span class="pill s-${SV[s][0]}">${SV[s][1]}</span>`).join('')}</td>
${sc('e')}${sc('f')}${sc('g')}
<td>${x.d?esc(x.d):'<span class="muted">À planifier</span>'}</td>
<td class="chev" aria-hidden="true">›</td></tr>`}).join('');
  $('#empty').hidden=rows.length>0;
  $('#info').textContent=v.length?`${(st.page-1)*per+1} à ${(st.page-1)*per+rows.length} sur ${v.length}`:'0 résultat';
  const s=Math.max(1,Math.min(st.page-2,pages-4)),e=Math.min(pages,s+4);
  let b=`<button data-p="${st.page-1}" aria-label="Page précédente" ${st.page<2?'disabled':''}>‹</button>`;
  for(let p=s;p<=e;p++)b+=`<button data-p="${p}" ${p===st.page?'aria-current="page"':''}>${p}</button>`;
  b+=`<button data-p="${st.page+1}" aria-label="Page suivante" ${st.page>=pages?'disabled':''}>›</button><span class="sp"></span><select id="per" aria-label="Lignes par page">${[10,20,50].map(n=>`<option value="${n}" ${n===per?'selected':''}>${n} par page</option>`).join('')}</select>`;
  $('#pg').innerHTML=b;
  head();
}
function chips(){
  const all=[['','Tous les services'],...Object.keys(SV).map(k=>[k,k])];
  $('#chips').innerHTML=all.map(([k,l])=>`<button class="chip" data-s="${esc(k)}" aria-pressed="${st.svc===k}">${l}</button>`).join('');
}
function stats(){
  const avg=Math.round(D.reduce((a,x)=>a+x.q,0)/D.length),top=D.filter(x=>x.q>=85).length;
  $('#stats').innerHTML=`<span class="stat"><b>${D.length}</b>entreprises</span><span class="stat"><b>${avg} %</b>qualification moyenne</span><span class="stat"><b>${top}</b>prioritaires</span>`;
}
function openD(r,fromNav){
  const v=view(),i=v.findIndex(x=>x.r===r);if(i<0)return;
  const x=v[i],t=tier(x.q);
  if(!fromNav)last=document.activeElement;
  st.sel=r;st.page=Math.floor(i/st.per)+1;render();
  const sc=[['Adéquation services',x.e],['Taille & capacité d’achat',x.f],['Secteur & références',x.g]];
  const ph=(n,p)=>`<div class="card"><h4>Phare ${n} · ${esc(p.t)}</h4><p>${esc(p.b)}</p></div>`;
  const fl=(l,val,em)=>`<dt>${l}</dt><dd>${val?esc(val):`<span class="muted">${em}</span>`}</dd>`;
  $('#drawer').innerHTML=`<div class="dh"><div class="dtop"><span>Rang ${x.r} · ${i+1} sur ${v.length} dans cette liste</span><span class="nb"><button class="ib" id="pv" aria-label="Entreprise précédente" ${i<1?'disabled':''}>‹</button><button class="ib" id="nx" aria-label="Entreprise suivante" ${i>=v.length-1?'disabled':''}>›</button><button class="ib" id="cl" aria-label="Fermer">✕</button></span></div>
<h2 id="dn">${esc(x.n)}</h2><span class="pill t-${t[0]}">${t[1]} · ${x.q} %</span>${x.s.map(s=>`<span class="pill s-${SV[s][0]}">${s}</span>`).join('')}</div>
<div class="db"><h3>Scores</h3><div class="sg">${sc.map(([l,n])=>`<div>${l}<b>${n}<small> / 100</small></b><span class="bar ${lvl(n)}"><i style="width:${n}%"></i></span></div>`).join('')}</div>
<h3>Ce qu’Atos apporte</h3>${ph(1,x.p1)}${ph(2,x.p2)}
<h3>Étude de cas Atos</h3><div class="card"><p>${esc(x.c)}</p></div>
<h3>Objections probables et réponses</h3>${x.o.map((o,j)=>`<div class="qa"><small>Objection ${j+1}</small><p>${esc(o)}</p><small>Réponse</small><p>${esc(x.a2[j]||'')}</p></div>`).join('')}
<h3>Suivi</h3><dl>${fl('Contacts',x.ct,'Pas encore renseigné')}${fl('Résumé de la situation',x.sm,'Pas encore renseigné')}${fl('Prochaine relance',x.d,'À planifier')}${fl('Sujet de la relance',x.sj,'Pas encore renseigné')}</dl></div>`;
  document.body.classList.add('open');
  $('#cl').focus();
}
function closeD(){
  document.body.classList.remove('open');st.sel=null;render();
  if(last&&document.contains(last)){const tr=document.querySelector(`tr[data-r="${last.dataset&&last.dataset.r}"]`);(tr||last).focus()}
}
document.addEventListener('click',e=>{
  const t=e.target;let el;
  if(el=t.closest('.sortb')){const k=el.dataset.k;if(st.key===k)st.dir*=-1;else{st.key=k;st.dir=(k==='n'||k==='r'||k==='d')?1:-1}st.page=1;render()}
  else if(el=t.closest('.chip')){st.svc=el.dataset.s;st.page=1;chips();render()}
  else if(el=t.closest('#pg button[data-p]')){st.page=+el.dataset.p;render();$('#panel').scrollTop=0}
  else if(t.closest('#reset')){st.q='';st.svc='';st.tier='';$('#q').value='';$('#tier').value='';st.page=1;chips();render()}
  else if(el=t.closest('tbody tr')){openD(+el.dataset.r)}
  else if(t.closest('#cl')||t.id==='scrim'){closeD()}
  else if(t.closest('#pv')||t.closest('#nx')){const v=view(),i=v.findIndex(x=>x.r===st.sel),n=v[i+(t.closest('#pv')?-1:1)];if(n)openD(n.r,true)}
});
document.addEventListener('change',e=>{if(e.target.id==='per'){st.per=+e.target.value;st.page=1;render()}if(e.target.id==='tier'){st.tier=e.target.value;st.page=1;render()}});
$('#q').addEventListener('input',e=>{st.q=e.target.value;st.page=1;render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('open'))closeD();
  else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tbody tr')){e.preventDefault();openD(+e.target.dataset.r)}
});
stats();chips();render();
</script>
</body>
</html>
