["Predictive Analytics","L’analyse des données annonce les pannes avant qu’elles arrivent. {n} planifie mieux sa maintenance et réduit les arrêts.","Data analysis predicts failures before they happen. {n} plans maintenance better and reduces downtime."],
["Intelligent Video Surveillance","Des caméras intelligentes détectent intrusions et situations à risque. {n} protège ses sites isolés avec moins de gardiens.","Smart cameras detect intrusions and risky situations. {n} protects its remote sites with fewer guards."],
["IoT Applications","Des capteurs remontent l’état des installations en temps réel. {n} suit ses équipements à distance et intervient au bon moment.","Sensors report the state of installations in real time. {n} tracks its equipment remotely and intervenes at the right time."],
["SAP S/4HANA","Un ERP unique relie finances, achats et stocks. {n} pilote ses coûts et ses approvisionnements avec des chiffres fiables.","A single ERP links finance, purchasing and inventory. {n} steers its costs and supplies with reliable figures."]],
public:[
["Cybersecurity Audit","Un audit montre les failles des systèmes de l’État avant un incident. {n} sait quoi corriger en priorité avec un budget limité.","An audit shows the flaws in State systems before an incident. {n} knows what to fix first with a limited budget."],
["Data Center Infrastructure","Un centre de données sécurisé héberge les services publics. {n} garde ses données sous contrôle et ses services disponibles.","A secure data center hosts public services. {n} keeps its data under control and its services available."],
["Electronic Document Management (GED)","Les documents papier deviennent des dossiers numériques classés et retrouvables. {n} traite les demandes plus vite et perd moins de dossiers.","Paper documents become filed, searchable digital records. {n} handles requests faster and loses fewer files."],
["Customer Portals","Un portail permet aux citoyens de faire leurs démarches en ligne. {n} réduit les files d’attente et le papier.","A portal lets citizens do their procedures online. {n} cuts queues and paperwork."],
["Digital Signature","La signature électronique remplace les circuits de papier. {n} valide les documents plus vite et de façon traçable.","Electronic signature replaces paper circuits. {n} approves documents faster and with full traceability."],
["Disaster Recovery (DR)","Une copie de secours permet de redémarrer après une panne ou un sinistre. {n} évite l’arrêt des services aux citoyens.","A backup copy allows a restart after an outage or disaster. {n} avoids interrupting services to citizens."],
["Security Awareness","Les agents apprennent à repérer les mails piégés et les faux liens. {n} réduit le risque d’attaque par erreur humaine.","Staff learn to spot phishing emails and fake links. {n} reduces the risk of attacks caused by human error."]],
intl:[
["Unified Endpoint Management (UEM)","Tous les ordinateurs et mobiles sont gérés depuis un seul endroit. {n} garde un parc à jour, même sur le terrain.","All computers and mobiles are managed from one place. {n} keeps its estate up to date, even in the field."],
["Microsoft 365 Integration","Mails, documents et visioconférences fonctionnent ensemble et en sécurité. {n} facilite le travail entre bureau et terrain.","Email, documents and video calls work together securely. {n} makes work between office and field easier."],
["Managed Service Desk","Un support unique répond aux problèmes informatiques des agents. {n} réduit le temps perdu en panne.","A single support desk answers staff IT problems. {n} reduces time lost to outages."],
["Workplace Security","Postes et données sont protégés où que l’on travaille. {n} sécurise le télétravail et les déplacements.","Workstations and data are protected wherever people work. {n} secures remote work and travel."],
["Cloud Security","Les outils hébergés dans le cloud sont protégés et surveillés. {n} garde ses données sensibles sous contrôle.","Tools hosted in the cloud are protected and monitored. {n} keeps its sensitive data under control."],
["Security Awareness","Les équipes apprennent à reconnaître les arnaques et mails piégés. {n} limite les fuites de données par erreur.","Teams learn to recognize scams and phishing emails. {n} limits accidental data leaks."]],
bpo:[
["Managed Service Desk","Un support informatique prend en charge les pannes des conseillers. {n} réduit les arrêts de poste et garde ses plateaux productifs.","An IT support desk handles agents' outages. {n} reduces workstation downtime and keeps its floors productive."],
["Unified Endpoint Management (UEM)","Tous les postes sont déployés et mis à jour depuis un seul outil. {n} ouvre de nouveaux sites plus vite.","All workstations are deployed and updated from a single tool. {n} opens new sites faster."],
["Virtual Desktop Infrastructure (VDI)","Les conseillers travaillent sur un poste virtuel sécurisé, même à domicile. {n} protège les données de ses clients.","Agents work on a secure virtual desktop, even from home. {n} protects its clients' data."],
["Infrastructure as a Service (IaaS)","Les ressources informatiques s’ajustent selon l’activité. {n} paie ce qu’il utilise lors des pics.","IT resources scale with activity. {n} pays only for what it uses during peaks."],
["Workplace Security","Les postes et les accès des conseillers sont protégés. {n} rassure ses clients exigeants sur la sécurité.","Agents' workstations and access are protected. {n} reassures its demanding clients about security."],
["Intelligent Service Desk","Un assistant IA répond seul aux demandes simples des conseillers. {n} résout plus de problèmes sans mobiliser d’équipe.","An AI assistant answers agents' simple requests on its own. {n} solves more problems without tying up a team."]],
ins:[

["Customer Portals","Un portail permet de souscrire et déclarer un sinistre en ligne. {n} traite les dossiers plus vite et satisfait ses clients.","A portal lets customers take out a policy and file a claim online. {n} processes files faster and satisfies its customers."],
["Robotic Process Automation (RPA)","Un robot logiciel saisit et vérifie les dossiers répétitifs. {n} gagne du temps et réduit les erreurs de saisie.","A software robot enters and checks repetitive files. {n} saves time and reduces data-entry errors."],
["Electronic Document Management (GED)","Contrats et dossiers clients sont archivés et retrouvés en quelques secondes. {n} réduit le papier et gagne en conformité.","Contracts and customer files are archived and found in seconds. {n} cuts paper and improves compliance."],
["Salesforce CRM","Un outil unique suit prospects, clients et contrats. {n} relance au bon moment et vend plus facilement.","A single tool tracks prospects, customers and contracts. {n} follows up at the right time and sells more easily."],
["Data Loss Prevention (DLP)","Cet outil empêche les données clients de sortir par erreur. {n} réduit le risque de fuite et de sanction.","This tool stops customer data from leaving by mistake. {n} reduces the risk of leaks and penalties."],
["Disaster Recovery (DR)","Une copie de secours relance les systèmes après une panne. {n} continue d’indemniser ses clients sans interruption.","A backup copy restarts systems after an outage. {n} keeps compensating its customers without interruption."]],

const EN={"Cybersécurité": "Cybersecurity", "une protection des systèmes industriels et des réseaux du site minier, surveillés 24h/24. Résultat attendu pour {n} : arrêts de production évités, données d’exploitation et équipements critiques protégés.": "Protection of the industrial systems and networks of the mining site, monitored 24/7. Expected result for {n}: production stoppages avoided, operating data and critical equipment protected.", "Cloud & infrastructure moderne": "Cloud & modern infrastructure", "une infrastructure robuste pour les sites isolés, avec sauvegarde et reprise d’activité. Résultat attendu pour {n} : systèmes toujours disponibles sur site, risque d’arrêt de production réduit.": "A robust infrastructure for remote sites, with backup and disaster recovery. Expected result for {n}: systems always available on site, lower risk of production stoppage.", "Atos gère le cloud hybride d’une société informatique de santé et a remis ses services en route en 5 jours après une attaque par rançongiciel. Résultat : 6,5 M$ d’économies par an et 34 % d’incidents graves en moins.": "Atos manages the hybrid cloud of a healthcare IT company and got its services back up in 5 days after a ransomware attack. Result: $6.5M in annual savings and 34% fewer major incidents.", "Les décisions informatiques sont prises par le groupe actionnaire, pas localement.": "IT decisions are made by the parent group, not locally.", "Nous n’avons jamais eu de gros incident ; la cybersécurité semble chère.": "We have never had a major incident; cybersecurity seems expensive.", "Nous opérons dans 54 pays pour plus de 4 500 clients : nous pouvons nous aligner sur les standards de votre groupe tout en vous servant localement depuis notre bureau de Madagascar.": "We operate in 54 countries for more than 4,500 clients: we can align with your group’s standards while serving you locally from our Madagascar office.", "Un incident coûte plus cher que la prévention : à Paris 2024, nous avons analysé 55 milliards d’événements avec zéro incident ; chez une grande banque, notre MDR a réduit de 50 % l’effort d’analyse.": "An incident costs more than prevention: at Paris 2024 we analyzed 55 billion events with zero incidents; at a major bank, our MDR cut analysis effort by 50%.", "la modernisation des plateformes (facturation, applications clients) sur un cloud flexible. Résultat attendu pour {n} : offres lancées plus vite, coûts d’infrastructure réduits.": "Modernization of platforms (billing, customer applications) on a flexible cloud. Expected result for {n}: offers launched faster, lower infrastructure costs.", "une protection du cœur de réseau et des plateformes clients, avec détection continue des attaques. Résultat attendu pour {n} : réseau disponible, moins de pannes et de fraudes, image de marque protégée.": "Protection of the network core and customer platforms, with continuous attack detection. Expected result for {n}: network available, fewer outages and frauds, brand image protected.", "Atos (Eviden) a placé des ingénieurs cloud directement dans les équipes informatiques de Deutsche Telekom pour accélérer leur passage au cloud AWS. Résultat : les équipes ont nettement avancé dans leur parcours cloud.": "Atos (Eviden) embedded cloud engineers directly in Deutsche Telekom’s IT teams to speed up their move to the AWS cloud. Result: the teams made clear progress on their cloud journey.", "Nous avons déjà nos équipes réseau et nos partenaires ; qu’apporte Atos en plus ?": "We already have our network teams and partners; what does Atos add?", "Migrer vers le cloud est risqué et la connexion internet n’est pas toujours stable.": "Migrating to the cloud is risky and the internet connection is not always stable.", "Nous renforçons vos équipes existantes : chez Deutsche Telekom, nos ingénieurs cloud ont travaillé directement dans les équipes du client pour accélérer la migration.": "We reinforce your existing teams: at Deutsche Telekom, our cloud engineers worked directly inside the client’s teams to speed up the migration.", "Nous migrons par vagues, avec un modèle hybride possible (une partie reste sur site) : nous avons migré plus de 750 serveurs de Banco Mercantil en 12 mois.": "We migrate in waves, with a possible hybrid model (part stays on site): we migrated more than 750 Banco Mercantil servers in 12 months.", "Atos a protégé les Jeux Olympiques de Paris 2024 : 55 milliards d’événements de sécurité analysés et plus de 400 faux sites de billetterie repérés. Résultat : zéro incident ayant touché les Jeux.": "Atos protected the Paris 2024 Olympic Games: 55 billion security events analyzed and more than 400 fake ticketing sites detected. Result: zero incidents affecting the Games.", "un centre de surveillance sécurité (SOC) géré par Atos, qui repère et bloque attaques et fraudes sur vos systèmes bancaires et vos canaux digitaux. Résultat attendu pour {n} : moins de fraudes et de pannes, clients rassurés, conformité aux exigences de la banque centrale facilitée.": "A security operations center (SOC) run by Atos, which detects and blocks attacks and fraud on your banking systems and digital channels. Expected result for {n}: fewer frauds and outages, reassured customers, easier compliance with central bank requirements.", "la migration des applications bancaires vers un cloud sécurisé, avec sauvegarde et reprise d’activité. Résultat attendu pour {n} : agences et canaux digitaux disponibles en continu, coûts d’infrastructure maîtrisés, nouveaux services lancés plus vite.": "Migration of banking applications to a secure cloud, with backup and disaster recovery. Expected result for {n}: branches and digital channels continuously available, controlled infrastructure costs, new services launched faster.", "Une grande banque mondiale a confié à Atos la surveillance de sa sécurité 24h/24 (service MDR piloté par IA). Résultat : alertes validées en quelques secondes au lieu de plusieurs heures, et temps de réaction ramené de plusieurs jours à quelques minutes.": "A major global bank entrusted Atos with 24/7 monitoring of its security (AI-driven MDR service). Result: alerts validated in seconds instead of hours, and response time cut from several days to a few minutes.", "Les données bancaires et les exigences de la banque centrale imposent un contrôle strict de l’hébergement et des accès.": "Banking data and central bank requirements call for strict control over hosting and access.", "Nous avons lancé en juillet 2026 notre Sovereign Cloud, conçu et exploité dans l’UE, et nous accompagnons déjà des banques régulées (migration cloud de Banco Mercantil, sécurité réseau de NORD/LB).": "We launched our Sovereign Cloud in July 2026, designed and operated in the EU, and we already support regulated banks (Banco Mercantil cloud migration, NORD/LB network security).", "une détection en temps réel de la fraude, des faux sites et des faux messages, avec protection 24h/24 de la plateforme de paiement. Résultat attendu pour {n} : transactions sécurisées, moins de pertes liées à la fraude, confiance des utilisateurs préservée.": "Real-time detection of fraud, fake websites and fake messages, with 24/7 protection of the payment platform. Expected result for {n}: secure transactions, fewer fraud losses, user trust preserved.", "une infrastructure cloud qui absorbe les pics de transactions, avec reprise d’activité automatique. Résultat attendu pour {n} : paiements disponibles 24h/24, même aux heures de pointe, et croissance sans investissement lourd.": "A cloud infrastructure that absorbs transaction peaks, with automatic recovery. Expected result for {n}: payments available 24/7, even at peak times, and growth without heavy investment.", "La fraude et les pics de transactions exigent une réaction immédiate, plus rapide qu’un prestataire étranger.": "Fraud and transaction peaks require an immediate response, faster than a foreign provider.", "Notre surveillance est continue 24h/24 et très automatisée : à Paris 2024, nous disposions de plus de 300 scénarios de réponse automatiques pour réagir en quelques minutes.": "Our monitoring is continuous 24/7 and highly automated: at Paris 2024 we had more than 300 automatic response scenarios to react within minutes.", "une protection des systèmes qui pilotent la production et la distribution d’électricité, avec détection des intrusions. Résultat attendu pour {n} : moins de coupures liées à une attaque, continuité du service public assurée.": "Protection of the systems that run electricity production and distribution, with intrusion detection. Expected result for {n}: fewer outages caused by attacks, public service continuity ensured.", "Plateformes intelligentes": "Smart platforms", "des plateformes de suivi des installations (compteurs, centrales, maintenance) avec tableaux de bord en temps réel. Résultat attendu pour {n} : pannes détectées plus tôt, maintenance mieux planifiée, meilleure qualité de service.": "Platforms to monitor installations (meters, power plants, maintenance) with real-time dashboards. Expected result for {n}: faults detected earlier, better planned maintenance, better quality of service.", "Le budget est limité et la priorité est la production et le réseau, pas l’informatique.": "The budget is limited and the priority is production and the network, not IT.", "Nos cas clients montrent des gains concrets : chez Veolia, les bilans de service sont 3 fois plus rapides et les temps de réponse améliorés de 47 % grâce à une plateforme commune.": "Our client cases show concrete gains: at Veolia, service reviews are 3 times faster and response times improved by 47% thanks to a common platform.", "une surveillance des systèmes de stocks, de logistique et de stations, avec alerte immédiate en cas d’attaque. Résultat attendu pour {n} : approvisionnement non interrompu, pertes évitées en cas de cyberattaque.": "Monitoring of inventory, logistics and station systems, with immediate alerts in case of attack. Expected result for {n}: uninterrupted supply, losses avoided in case of cyberattack.", "une plateforme de pilotage de la distribution et du support (stations, flotte, stocks) avec alertes automatiques. Résultat attendu pour {n} : moins de ruptures, interventions plus rapides, meilleure traçabilité.": "A platform to steer distribution and support (stations, fleet, inventory) with automatic alerts. Expected result for {n}: fewer stockouts, faster interventions, better traceability.", "Nos dépôts et stations sont dispersés ; la priorité est l’approvisionnement, pas un projet informatique.": "Our depots and stations are spread out; the priority is supply, not an IT project.", "Une plateforme de suivi avec alertes automatiques sert justement cet objectif : chez Veolia, la même logique a amélioré de 47 % les temps de réponse sur 45 pays.": "A monitoring platform with automatic alerts serves exactly this goal: at Veolia, the same approach improved response times by 47% across 45 countries.", "Atos est un grand groupe européen : aura-t-il vraiment une équipe sur place à Madagascar ?": "Atos is a large European group: will it really have a team on the ground in Madagascar?", "Oui : nous avons un bureau à Madagascar avec un Country Manager (présence sous la marque Bull depuis 1974), 12 entités en Afrique et des centres de livraison au Maroc, au Sénégal et en Égypte.": "Yes: we have an office in Madagascar with a Country Manager (present under the Bull brand since 1974), 12 entities in Africa and delivery centers in Morocco, Senegal and Egypt.", "une protection des systèmes de réservation, d’enregistrement et d’exploitation, surveillés 24h/24. Résultat attendu pour {n} : ventes en ligne et opérations préservées, données des passagers protégées.": "Protection of reservation, check-in and operations systems, monitored 24/7. Expected result for {n}: online sales and operations preserved, passenger data protected.", "le passage des systèmes de réservation et d’exploitation vers un cloud fiable. Résultat attendu pour {n} : moins de pannes en période de pointe, meilleure expérience voyageur.": "Moving reservation and operations systems to a reliable cloud. Expected result for {n}: fewer outages at peak periods, better traveler experience.", "Pour Satair (pièces d’avions), Atos a créé « Lilly », un assistant IA qui traite les demandes de devis reçues par mail. Résultat : temps de réponse passé de 24 heures à 2 minutes, avec 99 % de précision.": "For Satair (aircraft parts), Atos created “Lilly”, an AI assistant that handles quote requests received by email. Result: response time cut from 24 hours to 2 minutes, with 99% accuracy.", "Nos systèmes clés dépendent de fournisseurs aéronautiques mondiaux spécialisés.": "Our key systems depend on specialized global aviation suppliers.", "Nous travaillons déjà dans l’aérien : assistant IA de devis chez Satair (de 24 h à 2 min) et données du trafic aérien pour un organisme européen.": "We already work in aviation: AI quoting assistant at Satair (from 24 h to 2 min) and air traffic data for a European body.", "une protection des données clients et des applications de gestion des contrats, avec surveillance continue. Résultat attendu pour {n} : dossiers clients à l’abri, risque de fuite de données réduit, conformité facilitée.": "Protection of customer data and contract management applications, with continuous monitoring. Expected result for {n}: customer files safe, lower risk of data leaks, easier compliance.", "Applications digitales": "Digital applications", "un portail et une application pour souscrire, déclarer un sinistre et suivre son dossier en ligne. Résultat attendu pour {n} : sinistres traités plus vite, clients plus satisfaits, moins de papier.": "A portal and an app to take out a policy, file a claim and follow its progress online. Expected result for {n}: claims handled faster, happier customers, less paper.", "Nous avons déjà un prestataire informatique et nos priorités sont ailleurs.": "We already have an IT provider and our priorities lie elsewhere.", "Nous intervenons dans l’assurance : l’assureur Univé (1,7 million de membres) a amélioré de 150 % ses indicateurs de performance web grâce à la supervision que nous avons mise en place.": "We work in insurance: insurer Univé (1.7 million members) improved its web performance indicators by 150% thanks to the monitoring we set up.", "une protection des systèmes de production et de gestion, avec sauvegardes à l’abri des virus de rançon. Résultat attendu pour {n} : production non interrompue, données et sauvegardes protégées.": "Protection of production and management systems, with backups safe from ransomware. Expected result for {n}: uninterrupted production, data and backups protected.", "la migration des outils de gestion (production, stocks, facturation) vers un cloud fiable. Résultat attendu pour {n} : moins de pannes, données centralisées, moins de dépenses en serveurs.": "Migration of management tools (production, inventory, billing) to a reliable cloud. Expected result for {n}: fewer outages, centralized data, lower server spending.", "Nous sommes industriels, l’informatique n’est pas notre métier.": "We are an industrial company; IT is not our business.", "Nous prenons l’informatique en charge à votre place avec nos services gérés : un groupe agrochimique a réduit ses coûts et ses arrêts en nous confiant la gestion de son parc.": "We take over IT for you with our managed services: an agrochemical group cut its costs and downtime by entrusting us with the management of its estate.", "Atos a aidé l’assureur néerlandais Univé (1,7 million de membres) à surveiller en temps réel son site et ses applications cloud. Résultat : performance web améliorée de 150 %, donc un meilleur classement sur les moteurs de recherche.": "Atos helped Dutch insurer Univé (1.7 million members) monitor its website and cloud applications in real time. Result: web performance improved by 150%, hence a better ranking on search engines.", "une surveillance sécurité externalisée qui protège vos postes et votre application de crédit, sans monter d’équipe interne. Résultat attendu pour {n} : données des épargnants protégées, moins d’interruptions, crédibilité renforcée auprès des bailleurs et du régulateur.": "Outsourced security monitoring that protects your workstations and your credit application, without building an in-house team. Expected result for {n}: savers’ data protected, fewer interruptions, stronger credibility with donors and the regulator.", "l’hébergement des applications dans un cloud sécurisé, avec sauvegardes automatiques et accès depuis toutes les agences. Résultat attendu pour {n} : moins de pannes, agences toujours connectées, plus besoin de gérer de gros serveurs.": "Hosting of applications in a secure cloud, with automatic backups and access from every branch. Expected result for {n}: fewer outages, branches always connected, no need to manage large servers.", "Ces solutions semblent réservées aux grandes banques ; nous sommes une petite structure.": "These solutions seem reserved for large banks; we are a small organization.", "Nos services de cybersécurité s’adressent à des organisations de toutes tailles, avec un centre de surveillance mutualisé : vous payez un service, pas une équipe interne.": "Our cybersecurity services are for organizations of all sizes, with a shared monitoring center: you pay for a service, not an in-house team.", "une infrastructure cloud flexible adaptée aux pics d’activité, avec sécurité et sauvegarde intégrées. Résultat attendu pour {n} : nouveaux plateaux ou clients ouverts plus vite, coûts informatiques ajustés à l’activité.": "A flexible cloud infrastructure suited to activity peaks, with built-in security and backup. Expected result for {n}: new floors or clients opened faster, IT costs adjusted to activity.", "Poste de travail digital": "Digital workplace", "des postes de travail modernes, un support informatique proactif et un télétravail sécurisé pour les conseillers. Résultat attendu pour {n} : moins d’arrêts de poste, conseillers plus productifs, nouveaux sites déployés plus vite.": "Modern workstations, proactive IT support and secure remote work for agents. Expected result for {n}: fewer workstation outages, more productive agents, new sites deployed faster.", "Nos marges sont serrées et les clients imposent souvent leurs propres outils.": "Our margins are tight and clients often impose their own tools.", "Notre infrastructure cloud s’ajuste à votre activité ; chez Satair, notre assistant IA a aidé 230 agents à passer de 24 h à 2 min de réponse, un argument de productivité à présenter à vos clients.": "Our cloud infrastructure adapts to your activity; at Satair, our AI assistant helped 230 agents go from 24 h to 2 min response time, a productivity argument to present to your clients.", "une application de suivi des crédits et de l’épargne, utilisable sur smartphone par les agents de terrain. Résultat attendu pour {n} : dossiers traités plus vite, moins d’erreurs de saisie, plus de clients touchés.": "An app to track loans and savings, usable on smartphones by field agents. Expected result for {n}: files processed faster, fewer data-entry errors, more customers reached.", "des plateformes d’automatisation du support et d’observation du réseau (ServiceNow, Dynatrace). Résultat attendu pour {n} : incidents résolus plus vite, moins d’interruptions pour les abonnés.": "Support automation and network observability platforms (ServiceNow, Dynatrace). Expected result for {n}: incidents resolved faster, fewer interruptions for subscribers.", "Pour un fournisseur de plateforme e-commerce, Atos a mis en place une supervision intelligente avec détection automatique des causes de panne. Résultat : disponibilité de 99,95 % et clients touchés par des incidents passés de 16 % à 0,2 %.": "For an e-commerce platform provider, Atos implemented smart monitoring with automatic root-cause detection of failures. Result: 99.95% availability and customers affected by incidents down from 16% to 0.2%.", "une protection des services en ligne et des bases de données de l’administration, avec un centre de surveillance. Résultat attendu pour {n} : services publics disponibles, données des citoyens protégées, confiance renforcée.": "Protection of the government’s online services and databases, with a monitoring center. Expected result for {n}: public services available, citizens’ data protected, trust strengthened.", "des services en ligne pour les usagers (déclarations, paiements, démarches) et des outils de suivi interne. Résultat attendu pour {n} : démarches plus rapides pour les citoyens, moins de papier, recettes mieux suivies.": "Online services for users (filings, payments, procedures) and internal tracking tools. Expected result for {n}: faster procedures for citizens, less paper, better revenue tracking.", "Les données de l’État doivent rester sous contrôle et les marchés publics sont longs.": "State data must remain under control and public procurement takes a long time.", "Notre Sovereign Cloud est conçu et exploité dans l’UE, et notre équipe à Madagascar fait de la transformation digitale du secteur public une priorité (interview de notre directeur, 2024).": "Our Sovereign Cloud is designed and operated in the EU, and our team in Madagascar makes public-sector digital transformation a priority (interview with our director, 2024).", "une protection des systèmes de suivi des marchandises et des équipements en réseau. Résultat attendu pour {n} : opérations non interrompues, données clients et douanières protégées.": "Protection of goods-tracking systems and networked equipment. Expected result for {n}: uninterrupted operations, customer and customs data protected.", "des postes de travail et outils de collaboration pour les équipes terrain et bureau. Résultat attendu pour {n} : équipes connectées, moins de temps perdu en panne informatique.": "Workstations and collaboration tools for field and office teams. Expected result for {n}: connected teams, less time lost to IT outages.", "Nos outils actuels fonctionnent ; l’urgence n’est pas évidente.": "Our current tools work; the urgency is not obvious.", "Pour un organisme européen de trafic aérien, nous avons mis en place un reporting unique et fiable qui contribue à réduire les retards ; chez Satair, le temps de réponse est passé de 24 h à 2 min.": "For a European air traffic body, we set up a single, reliable reporting system that helps reduce delays; at Satair, response time went from 24 h to 2 min.", "des applications de paiement fluides et de nouveaux services (factures, épargne, crédit). Résultat attendu pour {n} : plus d’utilisateurs actifs et plus de transactions par client.": "Smooth payment applications and new services (bills, savings, credit). Expected result for {n}: more active users and more transactions per customer.", "des hébergements et réseaux modernisés avec supervision de bout en bout. Résultat attendu pour {n} : moins de pannes, meilleure qualité de service.": "Modernized hosting and networks with end-to-end monitoring. Expected result for {n}: fewer outages, better quality of service.", "des plateformes d’automatisation du support et d’observation du réseau (ServiceNow, Dynatrace). Résultat attendu pour {n} : incidents résolus plus vite, moins d’interruptions pour les clients.": "Support automation and network observability platforms (ServiceNow, Dynatrace). Expected result for {n}: incidents resolved faster, fewer interruptions for customers.", "Nous avons déjà nos équipes et nos fournisseurs techniques ; qu’apporte Atos en plus ?": "We already have our own teams and technical suppliers; what does Atos add?", "l’hébergement des services de l’État dans un centre de données moderne et sécurisé, avec reprise d’activité. Résultat attendu pour {n} : services en ligne disponibles, données de l’État sous contrôle, coûts réduits.": "Hosting of State services in a modern, secure data center, with disaster recovery. Expected result for {n}: online services available, State data under control, lower costs.", "Pour un grand organisme européen de gestion du trafic aérien, Atos a migré les données vers le cloud et mis en place un reporting unique et fiable. Résultat : décisions en temps réel plus sûres et moins de retards de vols.": "For a major European air traffic management body, Atos migrated data to the cloud and set up a single, reliable reporting system. Result: safer real-time decisions and fewer flight delays.", "Data & IA": "Data & AI", "la collecte et l’analyse des données d’exploitation (maintenance prédictive, suivi de production). Résultat attendu pour {n} : moins de pannes d’équipements, production mieux pilotée.": "Collection and analysis of operating data (predictive maintenance, production tracking). Expected result for {n}: fewer equipment failures, better-steered production.", "L’agence informatique de l’État de Géorgie (États-Unis) a confié ses systèmes centraux à Atos en mode service. Résultat : plus de 30 % d’économies, qui financent un renforcement de la cybersécurité.": "The IT agency of the U.S. State of Georgia entrusted its core systems to Atos as a service. Result: more than 30% savings, which fund stronger cybersecurity.", "la modernisation du système d’information et des données de comptage et de facturation dans un cloud fiable. Résultat attendu pour {n} : facturation plus fiable, moins de pannes informatiques, décisions plus rapides.": "Modernization of the information system and of metering and billing data in a reliable cloud. Expected result for {n}: more reliable billing, fewer IT outages, faster decisions.", "Veolia (eau, déchets, énergie) a unifié le support informatique de ses 45 pays sur une plateforme ServiceNow, cas client présenté par Atos. Résultat : bilans de service 3 fois plus rapides et temps de réponse amélioré de 47 %.": "Veolia (water, waste, energy) unified IT support across its 45 countries on a ServiceNow platform, a client case presented by Atos. Result: service reviews 3 times faster and response time improved by 47%.", "Nous n’avons pas les équipes pour exploiter une nouvelle plateforme.": "We don’t have the teams to run a new platform.", "Nous exploitons la plateforme pour vous (services gérés ServiceNow, Dynatrace) : pour un fournisseur e-commerce, nous avons atteint 99,95 % de disponibilité et fait passer les clients touchés de 16 % à 0,2 %.": "We run the platform for you (ServiceNow, Dynatrace managed services): for an e-commerce provider, we reached 99.95% availability and cut affected customers from 16% to 0.2%.", "Atos a migré plus de 750 serveurs de la banque brésilienne Banco Mercantil (8,7 millions de clients) vers Google Cloud en 12 mois. La banque dispose désormais d’une infrastructure moderne, sécurisée et évolutive.": "Atos migrated more than 750 servers of Brazilian bank Banco Mercantil (8.7 million customers) to Google Cloud in 12 months. The bank now has a modern, secure and scalable infrastructure.", "une plateforme cloud et des services gérés Atos que vous pouvez aussi proposer à vos clients. Résultat attendu pour {n} : offre élargie sans investir dans des serveurs, crédibilité renforcée.": "An Atos cloud platform and managed services that you can also offer to your clients. Expected result for {n}: broader offering without investing in servers, stronger credibility.", "une offre de sécurité prête à l’emploi, à intégrer à vos propres services. Résultat attendu pour {n} : vous proposez de la cybersécurité à vos clients sans investir dans un centre de surveillance.": "A ready-to-use security offering to integrate into your own services. Expected result for {n}: you offer cybersecurity to your clients without investing in a monitoring center.", "Atos est-il un concurrent plutôt qu’un partenaire ?": "Is Atos a competitor rather than a partner?", "En Afrique, nous travaillons aussi via des partenaires locaux dans plusieurs pays : vous pouvez intégrer nos services (cloud, sécurité, plateformes) à votre propre offre.": "In Africa, we also work through local partners in several countries: you can integrate our services (cloud, security, platforms) into your own offering.", "des tableaux de bord et une analyse des données clients et du risque (scoring, détection d’anomalies). Résultat attendu pour {n} : décisions de crédit plus rapides, fraudes repérées plus tôt.": "Dashboards and analysis of customer and risk data (scoring, anomaly detection). Expected result for {n}: faster credit decisions, fraud spotted earlier.", "des postes de travail et outils de collaboration pour le personnel au sol et en bureau. Résultat attendu pour {n} : équipes connectées, moins de temps perdu en panne informatique.": "Workstations and collaboration tools for ground and office staff. Expected result for {n}: connected teams, less time lost to IT outages.", "Atos assure le poste de travail et le support des 30 000 agents du ministère britannique Defra, avec analyse des usages et ordinateurs reconditionnés. Résultat : un service unique, plus proactif, moins coûteux et moins polluant.": "Atos provides the workplace and support for the 30,000 staff of the UK ministry Defra, with usage analysis and refurbished computers. Result: a single, more proactive, cheaper and less polluting service.", "un poste de travail moderne et un support unique pour les agents. Résultat attendu pour {n} : agents plus efficaces, parc mieux maîtrisé.": "A modern workstation and a single support desk for staff. Expected result for {n}: more efficient staff, better-controlled device estate.", "la migration des caisses, des stocks et de la fidélité vers un cloud fiable. Résultat attendu pour {n} : magasins connectés en permanence, moins de pannes aux caisses, coûts informatiques réduits.": "Migration of checkouts, inventory and loyalty to a reliable cloud. Expected result for {n}: stores permanently connected, fewer checkout outages, lower IT costs.", "un parc de postes et de terminaux de magasin géré à distance, avec support utilisateurs. Résultat attendu pour {n} : moins de pannes en magasin, coûts de maintenance réduits.": "A fleet of workstations and store terminals managed remotely, with user support. Expected result for {n}: fewer in-store outages, lower maintenance costs.", "Un grand distributeur américain a confié sa maintenance informatique à Atos. Résultat annoncé : 50 % de réduction des coûts de maintenance IT.": "A major U.S. retailer entrusted its IT maintenance to Atos. Announced result: 50% reduction in IT maintenance costs.", "Nos marges sont serrées et le budget informatique est limité.": "Our margins are tight and the IT budget is limited.", "Un distributeur américain a réduit de 50 % ses coûts de maintenance IT avec nous (étude à vérifier) ; le cloud à l’usage évite d’acheter des serveurs.": "A U.S. retailer cut its IT maintenance costs by 50% with us (study to be verified); pay-as-you-go cloud avoids buying servers.", "une protection des liaisons, des plateformes et des données clients, avec surveillance continue. Résultat attendu pour {n} : services disponibles, clients protégés, argument de confiance face à la concurrence.": "Protection of links, platforms and customer data, with continuous monitoring. Expected result for {n}: services available, customers protected, a trust argument against competitors.", "le passage des outils de gestion (stocks, ventes, flotte) vers un cloud fiable. Résultat attendu pour {n} : suivi en temps réel, moins de ruptures, coûts informatiques réduits.": "Moving management tools (inventory, sales, fleet) to a reliable cloud. Expected result for {n}: real-time tracking, fewer stockouts, lower IT costs.", "la migration des systèmes de suivi et de gestion vers un cloud fiable. Résultat attendu pour {n} : suivi des opérations en temps réel, moins de pannes.": "Migration of tracking and management systems to a reliable cloud. Expected result for {n}: real-time operations tracking, fewer outages.", "la migration des outils vers un cloud sécurisé, accessible depuis les bureaux et le terrain. Résultat attendu pour {n} : équipes connectées partout, données protégées, coûts informatiques réduits.": "Migration of tools to a secure cloud, accessible from offices and the field. Expected result for {n}: teams connected everywhere, data protected, lower IT costs.", "des postes de travail et des outils de collaboration sécurisés pour les équipes bureau et terrain, avec support utilisateurs. Résultat attendu pour {n} : équipes productives partout, moins de pannes, coûts informatiques réduits.": "Secure workstations and collaboration tools for office and field teams, with user support. Expected result for {n}: productive teams everywhere, fewer outages, lower IT costs.", "Nos achats passent par des accords-cadres internationaux déjà en place.": "Our purchases go through international framework agreements already in place.", "Nous servons des clients publics et institutionnels : nous équipons les 30 000 agents du ministère britannique Defra, une référence utile pour un référencement.": "We serve public and institutional clients: we equip the 30,000 staff of the UK ministry Defra, a useful reference for getting listed.", "des outils de gestion de la production, des stocks et des ventes reliés entre eux. Résultat attendu pour {n} : moins de pertes, décisions plus rapides, meilleure traçabilité.": "Linked tools to manage production, inventory and sales. Expected result for {n}: fewer losses, faster decisions, better traceability.", "la migration des outils de gestion vers un cloud fiable. Résultat attendu pour {n} : moins de pannes, données centralisées, coûts informatiques réduits.": "Migration of management tools to a reliable cloud. Expected result for {n}: fewer outages, centralized data, lower IT costs.", "Un grand groupe agrochimique international a confié à Atos la gestion du cycle de vie de ses équipements informatiques. Résultat annoncé : coûts réduits, cybersécurité renforcée et moins d’arrêts.": "A major international agrochemical group entrusted Atos with the lifecycle management of its IT equipment. Announced result: lower costs, stronger cybersecurity and less downtime.", "une infrastructure cloud qui absorbe les pics d’audience, avec supervision. Résultat attendu pour {n} : diffusion fluide et abonnés satisfaits, même lors des grands événements.": "A cloud infrastructure that absorbs audience peaks, with monitoring. Expected result for {n}: smooth broadcasting and satisfied subscribers, even during major events.", "une supervision de bout en bout de la plateforme de diffusion. Résultat attendu pour {n} : problèmes détectés avant que l’abonné ne les voie.": "End-to-end monitoring of the broadcast platform. Expected result for {n}: problems detected before the subscriber sees them.", "Notre groupe gère déjà l’infrastructure de diffusion.": "Our group already manages the broadcasting infrastructure.", "Nous proposons une supervision de bout en bout qui détecte les pannes avant l’abonné : sur une plateforme e-commerce, la disponibilité a atteint 99,95 %.": "We offer end-to-end monitoring that detects failures before the subscriber does: on an e-commerce platform, availability reached 99.95%.", "une analyse des données de sinistres et de clients, avec détection de fraude. Résultat attendu pour {n} : sinistres mieux maîtrisés, offres mieux ciblées.": "Analysis of claims and customer data, with fraud detection. Expected result for {n}: better-controlled claims, better-targeted offers.", "Nos outils actuels fonctionnent ; changer est risqué.": "Our current tools work; changing is risky.", "Nous déployons progressivement : chez Satair, nous avons démarré avec un seul assistant avant d’en déployer sept, et Univé a gagné 150 % sur ses indicateurs de performance web.": "We deploy gradually: at Satair, we started with a single assistant before rolling out seven, and Univé gained 150% on its web performance indicators.", "une application mobile et un portail clients modernes, avec ouverture de compte simplifiée. Résultat attendu pour {n} : plus de clients servis en ligne, moins de passages en agence.": "A modern mobile app and customer portal, with simplified account opening. Expected result for {n}: more customers served online, fewer branch visits.", "un parc informatique géré à distance (postes, messagerie, outils d’équipe). Résultat attendu pour {n} : moins de pannes, coûts de maintenance réduits.": "A remotely managed IT estate (workstations, email, team tools). Expected result for {n}: fewer outages, lower maintenance costs.", "un dossier patient informatisé et la prise de rendez-vous en ligne. Résultat attendu pour {n} : moins de papier, attente réduite, suivi patient plus fiable.": "A computerized patient record and online appointment booking. Expected result for {n}: less paper, shorter waits, more reliable patient follow-up.", "un hébergement sécurisé des dossiers patients. Résultat attendu pour {n} : dossiers accessibles à tout moment, données protégées.": "Secure hosting of patient records. Expected result for {n}: records accessible at any time, data protected.", "Un système de santé associatif américain en croissance a unifié ses dossiers patients avec Atos. Résultat : le dossier médical électronique a été mis en service dans les délais prévus.": "A growing U.S. community health system unified its patient records with Atos. Result: the electronic medical record went live on schedule.", "Les données patients sont très sensibles ; nous craignons de les confier à un tiers.": "Patient data is very sensitive; we are afraid to entrust it to a third party.", "Nous avons unifié les dossiers patients d’un système de santé américain dans les délais, et notre Sovereign Cloud garde vos données sous contrôle européen.": "We unified the patient records of a U.S. health system on schedule, and our Sovereign Cloud keeps your data under European control.", "la migration des outils de gestion (commandes, stocks, facturation) vers un cloud fiable. Résultat attendu pour {n} : moins de pannes, données centralisées, moins de dépenses en serveurs.": "Migration of management tools (orders, inventory, billing) to a reliable cloud. Expected result for {n}: fewer outages, centralized data, lower server spending.", "une protection des dossiers patients et des équipements connectés. Résultat attendu pour {n} : données de santé protégées, soins non interrompus.": "Protection of patient records and connected equipment. Expected result for {n}: health data protected, care not interrupted.", "des applications de gestion des ventes, des stocks et de fidélisation des clients. Résultat attendu pour {n} : stocks mieux suivis, moins de ruptures, clients fidélisés.": "Applications to manage sales, inventory and customer loyalty. Expected result for {n}: better-tracked inventory, fewer stockouts, loyal customers.", "une plateforme de gestion des services et d’automatisation des tâches répétitives. Résultat attendu pour {n} : moins de tâches manuelles, qualité suivie en temps réel.": "A service management platform with automation of repetitive tasks. Expected result for {n}: fewer manual tasks, quality tracked in real time.", "une protection des systèmes de gestion et des sauvegardes contre les virus de rançon. Résultat attendu pour {n} : activité non interrompue, données protégées.": "Protection of management systems and backups against ransomware. Expected result for {n}: uninterrupted activity, data protected.", "des plateformes de gestion de services prêtes à l’emploi (ServiceNow, supervision) pour industrialiser votre support. Résultat attendu pour {n} : incidents traités plus vite, qualité de service de vos clients suivie en temps réel.": "Ready-to-use service management platforms (ServiceNow, monitoring) to industrialize your support. Expected result for {n}: incidents handled faster, your clients’ service quality tracked in real time.", "un   st.sel=null;st.cat=true;render();
  const ord={T:0,E:1,M:2,F:3,Q:4};
  $('#drawer').innerHTML=`<div class="dh"><div class="dtop"><span>${L('fam')(FAM.reduce((a,f)=>a+f.i.length,0))}</span>${lgH()}<span class="nb"><button class="ib" id="cl" aria-label="${L('close')}">✕</button></span></div><h2 id="dn">${L('catt')}</h2><span class="pill t-b">${L('catsub')}</span></div><div class="db">${FAM.map(f=>`<h3><span class="pill s-${f.k}">${esc(f.n)}</span></h3><div class="card">${f.i.slice().sort((a,b)=>ord[a[2]]-ord[b[2]]).map(i=>`<div class="pr"><div><b>${esc(dn(i))}</b> <span class="pill ${POTC[i[2]]}">${POTL[lang][i[2]]}</span><p>${esc(dd(i))}</p></div></div>`).join('')}</div>`).join('')}</div>`;
  document.body.classList.add('open');$('#cl').focus();
}
function closeD(){
  document.body.classList.remove('open');st.sel=null;st.cat=false;render();
  if(last&&document.contains(last)){const tr2=document.querySelector(`tr[data-r="${last.dataset&&last.dataset.r}"]`);(tr2||last).focus()}
}
function setLang(l){
  lang=l;try{localStorage.setItem(LSK,l)}catch(e){}
  applyStatic();stats();chips();render();
  if(document.body.classList.contains('open')){if(st.cat)openCat(true);else if(st.sel!==null)openD(st.sel,true)}
  const b=document.querySelector(`${document.body.classList.contains('open')?'#drawer':'#lg'} button[data-l="${l}"]`);if(b)b.focus();
}
document.addEventListener('click',e=>{
  const t=e.target;let el;
  if(el=t.closest('.lg button')){setLang(el.dataset.l)}
  else if(t.closest('#catb')){openCat()}
  else if(el=t.closest('.sortb')){const k=el.dataset.k;if(st.key===k)st.dir*=-1;else{st.key=k;st.dir=(k==='n'||k==='r'||k==='d')?1:-1}st.page=1;render()}
  else if(el=t.closest('.chip')){st.svc=el.dataset.s;st.page=1;chips();render()}
  else if(el=t.closest('#pg button[data-p]')){st.page=+el.dataset.p;render();$('#panel').scrollTop=0}
  else if(t.closest('#reset')){st.q='';st.svc='';st.tier='';$('#q').value='';$('#tier').value='';st.page=1;chips();render()}
  else if(el=t.closest('tbody tr')){openD(+el.dataset.r)}
  else if(t.closest('#cl')||t.id==='scrim'){closeD()}
  else if(t.closest('#pv')||t.closest('#nx')){const v=view(),i=v.findIndex(x=>x.r===st.sel),n=v[i+(t.closest('#pv')?-1:1)];if(n)openD(n.r,true)}
});
document.addEventListener('change',e=>{if(e.target.id==='per'){st.per=+e.target.value;st.page=1;render()}if(e.target.id==='tier'){st.tier=e.target.value;st.page=1;render()}});
$('#q').addEventListener('input',e=>{st.q=e.target.value;st.page=1;render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('open'))closeD();
  else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tbody tr')){e.preventDefault();openD(+e.target.dataset.r)}
});
applyStatic();stats();chips();render();
</script>
</body>
</html>
